<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma Keyboards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              surface: {
                primary: '#0f172a',
                secondary: '#1e293b',
                interactive: 'rgba(255, 255, 255, 0.05)'
              },
              brand: {
                start: '#3b82f6',
                end: '#8b5cf6'
              },
              dark: {
                surface: {
                  primary: '#ffffff',
                  secondary: '#f3f4f6',
                  interactive: 'rgba(0, 0, 0, 0.05)'
                },
                text: {
                  primary: '#111827',
                  secondary: '#4b5563'
                },
                brand: {
                  start: '#2563eb',
                  end: '#7c3aed'
                },
                border: {
                  primary: '#e5e7eb'
                }
              },
              border: {
                primary: 'rgba(255, 255, 255, 0.1)'
              },
              text: {
                primary: '#f8fafc',
                secondary: '#94a3b8'
              }
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scale-in': 'scaleIn 0.2s ease-out',
              'fade-in': 'fadeIn 0.5s ease-out',
            },
            keyframes: {
              scaleIn: {
                '0%': { transform: 'scale(0.95)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #0f172a;
        color: white;
        overflow: hidden; /* App handles scrolling internally */
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(100, 116, 139, 0.5);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(100, 116, 139, 0.7);
      }
      /* Dark mode overrides */
      .dark body {
        background-color: #ffffff;
        color: #111827;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "react-toastify": "https://aistudiocdn.com/react-toastify@^11.0.5"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
