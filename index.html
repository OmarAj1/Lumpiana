<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma - Master Piano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="colors.css">
    <script>
      tailwind.config = {
        darkMode: 'class', // The 'dark' class on <html> activates dark-mode styles for Tailwind's `dark:` utility.
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
              mono: ['JetBrains Mono', 'SFMono-Regular', 'Menlo', 'monospace'],
            },
            colors: {
              // We use rgb(var(...) / <alpha-value>) to allow Tailwind's opacity modifiers (e.g., bg-surface-primary/50)
              'surface-primary': 'rgb(var(--color-surface-primary) / <alpha-value>)',
              'surface-secondary': 'rgb(var(--color-surface-secondary) / <alpha-value>)',
              'surface-tertiary': 'rgb(var(--color-surface-tertiary) / <alpha-value>)',
              'surface-glass': 'rgb(var(--color-surface-glass) / <alpha-value>)',
              'surface-interactive': 'rgb(var(--color-surface-interactive) / <alpha-value>)',
              
              'text-primary': 'rgb(var(--color-text-primary) / <alpha-value>)',
              'text-secondary': 'rgb(var(--color-text-secondary) / <alpha-value>)',
              
              'border-default': 'rgb(var(--color-border-default) / <alpha-value>)',
              'border-glass-light': 'rgb(var(--color-border-glass-light) / <alpha-value>)',
              
              'key-white-border': 'rgb(var(--color-key-white-border) / <alpha-value>)',
              'key-black-idle': 'rgb(var(--color-key-black-idle) / <alpha-value>)',

              brand: {
                primary: 'rgb(var(--color-brand-primary) / <alpha-value>)',
                secondary: 'rgb(var(--color-brand-secondary) / <alpha-value>)',
              },
              accent: {
                blue: 'rgb(var(--color-accent-blue) / <alpha-value>)',
                success: 'rgb(var(--color-accent-success) / <alpha-value>)',
                warning: 'rgb(var(--color-accent-warning) / <alpha-value>)',
                error: 'rgb(var(--color-accent-error) / <alpha-value>)',
              }
            },
            boxShadow: {
              'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.3)',
              'glow': '0 0 20px rgba(0, 122, 255, 0.5)',
              'ios': '0 4px 12px rgba(0, 0, 0, 0.08)',
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scale-in': 'scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
              'fade-in': 'fadeIn 0.6s ease-out',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              scaleIn: {
                '0%': { transform: 'scale(0.95)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: rgb(var(--color-base-body-bg));
        color: rgb(var(--color-base-body-text));
        overflow: hidden;
      }
      /* Hide Scrollbar for clean look */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
      /* Base glass styles (Dark Mode) */
      .glass-panel {
        background: rgba(28, 28, 30, 0.75); /* Fallback */
        background: rgb(var(--color-surface-glass) / 0.75);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgb(var(--color-border-glass-light) / 0.1);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "react-toastify": "https://aistudiocdn.com/react-toastify@^11.0.5"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
